<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loo's Pixel Tools</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #121212, #1e1e1e);
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 40px 20px;
      position: relative;
    }

    #watermark {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 0;
      opacity: 0.35;
      pointer-events: none;
      width: 200px;
      height: auto;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    #logo {
      width: 140px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 20px #0a4fffcc;
      background: #121212;
      user-select: none;
    }

    h1 {
      font-weight: 600;
      font-size: 1.8rem;
      color: #f0f0f0;
      text-shadow: 0 0 10px #0af;
      margin-bottom: 5px;
      text-align: center;
    }

    input[type="file"] {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #272727;
      color: #eee;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 5px #0af33a20;
    }

    input[type="file"]:hover,
    input[type="file"]:focus {
      background: #0a4fff;
      box-shadow: 0 0 10px #0a4fffcc;
      outline: none;
      color: white;
    }

    #spriteCanvas {
      image-rendering: pixelated;
      border: 2px solid #0a4fff;
      border-radius: 8px;
      background: transparent;
      width: 128px;
      height: 128px;
      box-shadow: 0 0 20px #0a4fff99;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    button {
      background: #0a4fff;
      border: none;
      color: white;
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 0 10px #0a4fffcc;
    }

    button:hover, button:focus {
      background: #0059cc;
      box-shadow: 0 0 15px #0059cccc;
      outline: none;
    }

    ul#frameList {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 140px;
      overflow-y: auto;
      width: 160px;
      border: 1px solid #0a4fff;
      border-radius: 8px;
      background: #222;
      box-shadow: 0 0 10px #0a4fff99;
    }

    ul#frameList li {
      padding: 8px 10px;
      border-bottom: 1px solid #0a4fff33;
      cursor: pointer;
      color: #ccc;
      user-select: none;
    }

    ul#frameList li.selected {
      background: #0a4fff;
      color: white;
      font-weight: bold;
    }
ul#frameList li.active {
  outline: 2px solid #00ffcc;
  background: #003a3a;
  color: #fff;
}
  </style>
</head>
<body>

  <img id="watermark" src="images/watermark.png" alt="Watermark">

  <div class="logo-container">
    <img id="logo" src="images/logo.png" alt="Logo" />
  </div>

  <input type="file" id="upload" accept="image/png" multiple />
  <label><input type="checkbox" id="spriteSheetCheckbox" /> *Splice - Select option before upload to splice sheets*</label>

  
  <div class="controls">
    <label>Frame W:
      <input type="number" id="frameWidthInput" value="32" min="1" style="width:60px;">
    </label>
    <label>Frame H:
      <input type="number" id="frameHeightInput" value="32" min="1" style="width:60px;">
    </label>
  </div>

  
  <div class="controls">
    <label>Start Frame:
      <input type="number" id="startFrameInput" value="1" min="1" style="width:60px;">
    </label>

    <label>
      <input type="checkbox" id="loopCheckbox" checked> Loop
    </label>

    <button id="prevFrameBtn">Prev</button>
    <button id="nextFrameBtn">Next</button>
    <button id="resetBtn">Reset</button>
  </div>

  <br>

  <label for="backgroundColorPicker">Background Color:</label>
  <input type="color" id="backgroundColorPicker" />
  <label><input type="checkbox" id="preserveTransparencyCheckbox" checked> Preserve Transparency</label>

  <button id="toggleGridBtn">Show Grid</button>

  <div class="controls">
    <button id="playPauseBtn">Play</button>
    <button id="removeFrameBtn" disabled>Remove Selected Frame</button>
    <button id="exportSheetBtn" disabled>Export Sprite Sheet</button>
    <button id="exportFramesZipBtn" disabled>Download Frames Individually</button>
    <button id="rotateBtn" disabled>Rotate</button>
  </div>

  <canvas id="spriteCanvas" width="32" height="32"></canvas>

  <p>Clicked Pixel Color: <span id="hexColorDisplay">#FFFFFF</span></p>
  <div id="imageInfoBox" style="border: 1px solid #ccc; padding: 10px; font-size: 14px; margin-top: 10px;">
    <strong>Image Info:</strong> No image loaded yet.
  </div>

  <ul id="frameList"></ul>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
  <script type="module" src="./sprite.js"></script>

  <script>
    const exportSheetBtn = document.getElementById("exportSheetBtn");
    const exportFramesZipBtn = document.getElementById("exportFramesZipBtn");
    const rotateBtn = document.getElementById("rotateBtn");

    function updateExportButtons(framesCount) {
  const hasSelection =
    window.animator &&
    window.animator.selectedFrames &&
    window.animator.selectedFrames.size > 0;

  exportSheetBtn.disabled = !hasSelection;
  exportFramesZipBtn.disabled = !hasSelection;
  rotateBtn.disabled = !hasSelection;
}

    document.addEventListener('framesUpdated', e => {
      updateExportButtons(e.detail.count);
    });
  </script>
</body>
</html>
